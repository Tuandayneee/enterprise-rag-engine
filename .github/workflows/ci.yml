name: Enterprise RAG CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-code-style:
    name: Code Style & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check Code Style with Black
        run: black --check src/ scripts/ tests/

      - name: Lint Code with Flake8
        run: flake8 src/ scripts/ tests/ --count --max-line-length=120 --extend-ignore=E203,E402,E501 --statistics

  test-and-benchmark:
    name: Unit Tests & RAGAS Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run Week 1 Chunking Benchmark
        run: python scripts/chunking_benchmark.py

      - name: Run Week 2 Ingestion Pipeline
        run: python scripts/ingestion.py

      - name: Run Week 4 RAGAS Quality Evaluation
        run: python scripts/evaluate_ragas.py

      - name: Run Comprehensive End-to-End Self-Test
        run: python scripts/self_test.py

      - name: Run Automated PyTest Integration Tests
        run: |
          pytest tests/ -v
          python test_runner.py

  docker-build:
    name: Docker Container Build Check
    needs: [lint-and-code-style, test-and-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/Dockerfile
          push: false
          tags: enterprise-rag-engine:latest
